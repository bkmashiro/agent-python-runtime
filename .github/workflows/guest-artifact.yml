name: Guest artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build base CPython/WASI Guest
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config unzip xz-utils

      - name: Verify locked build inputs
        run: |
          python3 tools/verify_sources_lock.py
          python3 -m unittest discover -s guest/tests -v
          python3 -m unittest discover -s tests -v
          bash -n guest/build/build-guest.sh

      - name: Build base Guest
        env:
          AGENT_RUNTIME_ARTIFACT_PROFILE: base
          AGENT_RUNTIME_MEMORY_MODEL: growable
          AGENT_RUNTIME_BUILD_DIR: ${{ runner.temp }}/agent-runtime-build
          AGENT_RUNTIME_VFS_ROOT: /dev/shm/agent-runtime-vfs
        run: |
          SOURCE_DATE_EPOCH=$(python3 tools/source_date_epoch.py "${GITHUB_SHA}")
          export SOURCE_DATE_EPOCH
          guest/build/build-guest.sh

      - name: Verify distribution
        run: |
          ARTIFACT=$(python3 -c 'import json; print(json.load(open("dist/manifest.json"))["artifact"]["filename"])')
          python3 guest/build/verify-artifact.py "dist/${ARTIFACT}" dist/manifest.json
          (cd dist && sha256sum --check SHA256SUMS)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pysolate-guest-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  e2e:
    name: Run real Guest E2E
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pysolate-guest-${{ github.sha }}
          path: ${{ runner.temp }}/pysolate-dist

      - name: Verify and run
        run: |
          BUNDLE="${{ runner.temp }}/pysolate-dist"
          ARTIFACT=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["artifact"]["filename"])' "${BUNDLE}/manifest.json")
          python3 guest/build/verify-artifact.py "${BUNDLE}/${ARTIFACT}" "${BUNDLE}/manifest.json"
          (cd "${BUNDLE}" && sha256sum --check SHA256SUMS)
          AGENT_RUNTIME_GUEST="${BUNDLE}/${ARTIFACT}" go test ./integration/e2e -count=1 -v
