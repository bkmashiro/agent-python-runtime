name: Static checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25.x'
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test . -run '^TestManifestValidation$'
      - run: PYTHONPATH=guest python3 -m unittest discover -s guest
      # Full execution tests require the separately built Guest; run make check locally.
