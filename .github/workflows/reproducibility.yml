name: Guest reproducibility

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guest-reproducibility-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Clean build ${{ matrix.replica }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        replica: [one, two]
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.0'
          cache: true

      - name: Install host build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config unzip xz-utils
          rustup toolchain install 1.92.0 --profile minimal --target wasm32-unknown-unknown

      - name: Verify producer contracts
        run: |
          python3 tools/verify_sources_lock.py
          python3 -m unittest discover -s guest/tests -v
          python3 -m unittest discover -s tests -v
          go test ./cmd/validate-json-schema
          bash -n guest/build/build-guest.sh

      - name: Build exact bundle
        env:
          AGENT_RUNTIME_BUILD_DIR: ${{ runner.temp }}/agent-runtime-build
          AGENT_RUNTIME_DIST_DIR: ${{ runner.temp }}/agent-runtime-dist
          AGENT_RUNTIME_VFS_ROOT: /dev/shm/agent-runtime-vfs
          AGENT_RUNTIME_REPRO_EVIDENCE_DIR: ${{ runner.temp }}/agent-runtime-repro-evidence
          AGENT_RUNTIME_REPRO_REPLICA: ${{ matrix.replica }}
          AGENT_RUNTIME_REPRO_DETERMINISTIC_HASHER: "1"
          AGENT_RUNTIME_REPRO_AVOID_FILESTAT_METADATA: "1"
        run: |
          SOURCE_DATE_EPOCH=$(python3 tools/source_date_epoch.py "${GITHUB_SHA}")
          export SOURCE_DATE_EPOCH
          guest/build/build-guest.sh
          python3 guest/build/verify-artifact.py \
            "${AGENT_RUNTIME_DIST_DIR}/agent-python-runtime.wasm" \
            "${AGENT_RUNTIME_DIST_DIR}/manifest.json"
          (
            cd "${AGENT_RUNTIME_DIST_DIR}"
            sha256sum --check SHA256SUMS
          )

      - name: Upload clean bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducibility-${{ matrix.replica }}-${{ github.sha }}
          path: ${{ runner.temp }}/agent-runtime-dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload stage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducibility-stage-evidence-${{ matrix.replica }}-${{ github.sha }}
          path: ${{ runner.temp }}/agent-runtime-repro-evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  compare:
    name: Require exact bundle equality
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Download clean build one
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reproducibility-one-${{ github.sha }}
          path: ${{ runner.temp }}/build-one

      - name: Download clean build two
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reproducibility-two-${{ github.sha }}
          path: ${{ runner.temp }}/build-two

      - name: Download stage evidence one
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reproducibility-stage-evidence-one-${{ github.sha }}
          path: ${{ runner.temp }}/stage-one

      - name: Download stage evidence two
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reproducibility-stage-evidence-two-${{ github.sha }}
          path: ${{ runner.temp }}/stage-two

      - name: Compare retained build stages
        id: compare-stages
        continue-on-error: true
        run: |
          python3 tools/compare_guest_stage_evidence.py \
            "${{ runner.temp }}/stage-one" \
            "${{ runner.temp }}/stage-two" \
            --output "${{ runner.temp }}/reproducibility-stage-report.json"

      - name: Compare exact bytes with diagnostics
        id: compare
        continue-on-error: true
        run: |
          python3 tools/compare_guest_builds.py \
            "${{ runner.temp }}/build-one" \
            "${{ runner.temp }}/build-two" \
            --output "${{ runner.temp }}/reproducibility-report.json"

      - name: Upload reproducibility report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducibility-report-${{ github.sha }}
          path: ${{ runner.temp }}/reproducibility-report.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload reproducibility stage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducibility-stage-report-${{ github.sha }}
          path: ${{ runner.temp }}/reproducibility-stage-report.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Require valid stage evidence
        if: always()
        run: |
          python3 - "${{ runner.temp }}/reproducibility-stage-report.json" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if report.get("validation_errors"):
              raise SystemExit("retained build-stage evidence is invalid")
          print(json.dumps({
              "outcome": report["outcome"],
              "repeat_pack_outcome": report["repeat_pack_outcome"],
              "raw_wasm_match": report["raw_wasm_match"],
              "final_wasm_match": report["final_wasm_match"],
              "same_runner_pack_matches": report["same_runner_pack_matches"],
              "pack_input_matches": report["pack_input_matches"],
          }, sort_keys=True))
          PY

      - name: Enforce exact equality
        if: always()
        run: |
          python3 - "${{ runner.temp }}/reproducibility-report.json" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if report.get("exact_match") is not True:
              raise SystemExit("clean guest bundles are not byte-for-byte reproducible")
          print(json.dumps({
              "exact_match": True,
              "source_date_epoch": report["source_date_epoch"],
              "files": len(report["files"]),
              "wasm_sections": len(report["wasm_sections"]),
          }, sort_keys=True))
          PY
