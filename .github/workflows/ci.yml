name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts and static gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Verify source lock
        run: python3 tools/verify_sources_lock.py

      - name: Python contract tests
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s guest/tests -v

      - name: Go tests
        run: go test ./...

      - name: Go race tests
        run: go test -race ./...

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build ./...

      - name: Validate workflow files
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Diff hygiene
        run: git show --check --oneline --no-renames HEAD
