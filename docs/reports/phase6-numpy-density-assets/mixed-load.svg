<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc"><title id="title">Controlled mixed NumPy load</title><desc id="desc">Mixed cycle includes tiny, CPU, 4 MiB/500 ms and 16 MiB/2 s request classes.</desc><rect width="1000" height="580" fill="#ffffff"/><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17202a}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#566573}.axis{stroke:#9aa5b1;stroke-width:1}.grid{stroke:#e8ecef;stroke-width:1}.label{font-size:13px}.tick{font-size:12px;fill:#566573}.legend{font-size:12px}.range{stroke-width:3}.point{stroke:#fff;stroke-width:2}</style><text class="title" x="50" y="42">Controlled mixed NumPy load</text><text class="sub" x="50" y="67">Mixed cycle includes tiny, CPU, 4 MiB/500 ms and 16 MiB/2 s request classes.</text><text class="label" x="60" y="100" font-weight="700">Completed throughput (requests/s)</text><line class="grid" x1="60" y1="465" x2="470" y2="465"/><text class="tick" x="52" y="469" text-anchor="end">0</text><line class="grid" x1="60" y1="377.5" x2="470" y2="377.5"/><text class="tick" x="52" y="381.5" text-anchor="end">12.75</text><line class="grid" x1="60" y1="290" x2="470" y2="290"/><text class="tick" x="52" y="294" text-anchor="end">25.5</text><line class="grid" x1="60" y1="202.5" x2="470" y2="202.5"/><text class="tick" x="52" y="206.5" text-anchor="end">38.25</text><line class="grid" x1="60" y1="115" x2="470" y2="115"/><text class="tick" x="52" y="119" text-anchor="end">51.001</text><line class="axis" x1="60" y1="465" x2="470" y2="465"/><text class="tick" x="128.333" y="490" text-anchor="middle">open 10/s</text><line class="range" stroke="#0072B2" x1="128.333" y1="407.576" x2="128.333" y2="407.5"/><circle class="point" fill="#0072B2" cx="128.333" cy="407.531" r="6"/><text class="tick" x="265" y="490" text-anchor="middle">open 40/s</text><line class="range" stroke="#0072B2" x1="265" y1="236