<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Pysolate code-centred execution decisions</title><desc id="desc">Reach-gated source overlap, exact request sharing, and source-mismatch fresh execution.</desc><defs><pattern id="shared-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f0ebff"/><path d="M-2,2 l4,-4 M0,8 l8,-8 M6,10 l4,-4" stroke="#a682ff" stroke-width="1"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#667085"/></marker><style>.panel{font:700 13px Arial,sans-serif;fill:#344054}.heading{font:700 17px Arial,sans-serif;fill:#101828}.sub{font:11px Arial,sans-serif;fill:#667085}.actor,.axis-title{font:700 9px Arial,sans-serif;letter-spacing:.7px;fill:#475467}.code{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1d2939}.ln{font:9px ui-monospace,monospace;fill:#98a2b3}.note{font:8.2px Arial,sans-serif;fill:#475467}.note-label{font-weight:700;fill:#344054}.lane-label{font:9px Arial,sans-serif;fill:#475467}.metric{font:700 17px Arial,sans-serif;fill:#101828}.metric-note{font:10px Arial,sans-serif;fill:#667085}.logical{fill:#f5f7fa;stroke:#98a2b3}.box-text{font:700 10px Arial,sans-serif;fill:#344054}.box-sub{font:9px Arial,sans-serif;fill:#667085}.legend{font:10px Arial,sans-serif;fill:#475467}</style></defs><rect width="1200" height="520" fill="#ffffff"/><text x="20" y="35" class="panel">(a)</text><text x="20" y="58" class="heading">Reach-gated source prefix</text><text x="20" y="77" class="sub">Generation tail overlaps Host READ</text><rect x="20" y="94" width="360" height="43" rx="4" fill="#d9f4f1" stroke="#d9dde5"/><text x="28" y="111" class="ln">01</text><text x="50" y="111" class="code">record = slow.lookup(&#39;alpha&#39;)</text><text x="50" y="128" class="note"><tspan class="note-label">READ starts</tspan> · The first closed suite reaches the Host READ.</text><rect x="20" y="143" width="360" height="43" rx="4" fill="#e3efff" stroke="#d9dde5"/><text x="28" y="160" class="ln">02</text><text x="50" y="160" class="code">label = record[&#39;label&#39;].upper()</text><text x="50" y="177" class="note"><tspan class="note-label">source continues</tspan> · These lines arrive while the READ is in flight.</text><rect x="20" y="192" width="360" height="43" rx="4" fill="#e3efff" stroke="#d9dde5"/><text x="28" y="209" class="ln">03</text><text x="50" y="209" class="code">result = {&#39;label&#39;: label}</text><text x="50" y="226" class="note"><tspan class="note-label">source continues</tspan> · These lines arrive while the READ is in flight.</text><text x="20" y="258" class="axis-title">MEASURED EXECUTION</text><text x="20" y="282" class="lane-label">generate → execute</text><rect x="132" y="268" width="248" height="34" rx="3" fill="#f4f6f8" stroke="#d9dde5"/><rect x="132.0" y="271" width="117.8" height="13" rx="2" fill="#4a91ff"/><rect x="250.8" y="286" width="126.3" height="13" rx="2" fill="#21a99c"/><rect x="377.1" y="286" width="2.9" height="13" rx="2" fill="#a9b2c0"/><text x="20" y="350" class="lane-label">stream while generating</text><rect x="132" y="336" width="248" height="34" rx="3" fill="#f4f6f8" stroke="#d9dde5"/><rect x="132.0" y="339" width="226.5" height="13" rx="2" fill="#4a91ff"/><rect x="132.6" y="354" width="242.8" height="13" rx="2" fill="#21a99c"/><rect x="375.4" y="354" width="4.6" height="13" rx="2" fill="#a9b2c0"/><text x="20" y="430" class="metric">2950 ms → 1534 ms</text><text x="20" y="450" class="metric-note">1.923× mechanism window · matched run</text><line x1="395" y1="22" x2="395" y2="472" stroke="#e4e7ec"/><text x="420" y="35" class="panel">(b)</text><text x="420" y="58" class="heading">Exact request sharing</text><text x="420" y="77" class="sub">Logical requests share a sealed physical Guest</text><text x="420" y="103" class="actor">AGENT A</text><rect x="420" y="111" width="360" height="43" rx="4" fill="#e2f5e9" stroke="#d9dde5"/><text x="428" y="128" class="ln">02</text><text x="450" y="128" class="code">result = {&#39;square&#39;: inputs[&#39;value&#39;] * inputs[&#39;value&#39;]}</text><text x="450" y="145" class="note"><tspan class="note-label">physical owner</tspan> · This request owns the Guest execution.</text><text x="420" y="178" class="actor">AGENT B · IDENTICAL SEALED REQUEST</text><rect x="420" y="186" width="360" height="43" rx="4" fill="url(#shared-hatch)" stroke="#d9dde5"/><text x="428" y="203" class="ln">05</text><text x="450" y="203" class="code">result = {&#39;square&#39;: inputs[&#39;value&#39;] * inputs[&#39;value&#39;]}</text><text x="450" y="220" class="note"><tspan class="note-label">joins owner</tspan> · No duplicate physical Guest starts.</text><rect x="420" y="302" width="92" height="38" rx="5" class="logical"/><text x="439" y="325" class="box-text">logical A</text><rect x="420" y="362" width="92" height="38" rx="5" class="logical"/><text x="439" y="385" class="box-text">logical B</text><rect x="628" y="327" width="142" height="48" rx="5" fill="#e2f5e9" stroke="#6eb68a"/><text x="642" y="348" class="box-text">1 physical Guest</text><text x="634" y="364" class="box-sub">exact_shared</text><line x1="512" y1="321" x2="628" y2="343" stroke="#667085" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="512" y1="381" x2="628" y2="359" stroke="#667085" stroke-width="1.5" marker-end="url(#arrow)"/><text x="420" y="430" class="metric">2 logical → 1 physical</text><text x="420" y="450" class="metric-note">2 / 2 oracle results accepted</text><line x1="795" y1="22" x2="795" y2="472" stroke="#e4e7ec"/><text x="820" y="35" class="panel">(c)</text><text x="820" y="58" class="heading">Source mismatch fails closed</text><text x="820" y="77" class="sub">Different identity keeps fresh execution</text><text x="820" y="103" class="actor">EXACT REQUEST</text><rect x="820" y="111" width="360" height="43" rx="4" fill="#e2f5e9" stroke="#d9dde5"/><text x="828" y="128" class="ln">02</text><text x="850" y="128" class="code">result = {&#39;square&#39;: inputs[&#39;value&#39;] * inputs[&#39;value&#39;]}</text><text x="850" y="145" class="note"><tspan class="note-label">physical A</tspan> · The exact request executes normally.</text><text x="820" y="178" class="actor">SOURCE-MISMATCH REQUEST</text><rect x="820" y="186" width="360" height="43" rx="4" fill="#fff0d8" stroke="#d9dde5"/><text x="828" y="203" class="ln">05</text><text x="850" y="203" class="code">result = {&#39;square&#39;: pow(inputs[&#39;value&#39;], 2)}</text><text x="850" y="220" class="note"><tspan class="note-label">fresh physical B</tspan> · Different source starts an independent Guest.</text><rect x="820" y="302" width="112" height="38" rx="5" class="logical"/><text x="836" y="325" class="box-text">exact request</text><rect x="820" y="362" width="112" height="38" rx="5" fill="#fff0d8" stroke="#d59a3b"/><text x="830" y="385" class="box-text">source mismatch</text><rect x="1042" y="302" width="128" height="38" rx="5" fill="#e2f5e9" stroke="#6eb68a"/><text x="1059" y="325" class="box-text">physical Guest A</text><rect x="1042" y="362" width="128" height="38" rx="5" fill="#fff0d8" stroke="#d59a3b"/><text x="1052" y="385" class="box-text">fresh physical B</text><line x1="932" y1="321" x2="1042" y2="321" stroke="#667085" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="932" y1="381" x2="1042" y2="381" stroke="#667085" stroke-width="1.5" marker-end="url(#arrow)"/><text x="820" y="430" class="metric">2 logical → 2 physical</text><text x="820" y="450" class="metric-note">unsafe reuse = 0 · reject_source_mismatch</text><rect x="20" y="486" width="13" height="13" rx="2" fill="#d9f4f1" stroke="#7ccdc4"/><text x="39" y="497" class="legend">effect reached</text><rect x="145" y="486" width="13" height="13" rx="2" fill="#e3efff" stroke="#8eb7ee"/><text x="164" y="497" class="legend">overlapped source tail</text><rect x="318" y="486" width="13" height="13" rx="2" fill="#e2f5e9" stroke="#6eb68a"/><text x="337" y="497" class="legend">physical owner</text><rect x="460" y="486" width="13" height="13" rx="2" fill="url(#shared-hatch)" stroke="#a682ff"/><text x="479" y="497" class="legend">shared logical request; duplicate physical run skipped</text><rect x="790" y="486" width="13" height="13" rx="2" fill="#fff0d8" stroke="#d59a3b"/><text x="809" y="497" class="legend">fresh execution after identity rejection</text></svg>