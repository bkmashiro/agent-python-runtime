name: NumPy WASI official-source probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: numpy-wasi-probe-${{ github.sha }}
  cancel-in-progress: false

jobs:
  compile-probe:
    name: Probe official NumPy source against CPython WASI
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.0'
          cache: true

      - name: Install host build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config unzip xz-utils

      - name: Verify locked probe inputs
        run: |
          python3 tools/verify_sources_lock.py
          python3 tools/verify_sources_lock.py experiments/numpy-wasi/sources.lock.json
          bash -n guest/build/build-guest.sh
          bash -n experiments/numpy-wasi/probe.sh

      - name: Build pinned CPython WASI base
        env:
          AGENT_RUNTIME_BUILD_DIR: ${{ runner.temp }}/agent-runtime-build
          AGENT_RUNTIME_VFS_ROOT: /dev/shm/agent-runtime-vfs
        run: |
          SOURCE_DATE_EPOCH=$(python3 tools/source_date_epoch.py "${GITHUB_SHA}")
          export SOURCE_DATE_EPOCH
          guest/build/build-guest.sh

      - name: Run diagnostic NumPy compile probe
        env:
          AGENT_RUNTIME_BUILD_DIR: ${{ runner.temp }}/agent-runtime-build
          AGENT_RUNTIME_VFS_ROOT: /dev/shm/agent-runtime-vfs
          NUMPY_WASI_PROBE_DIR: ${{ runner.temp }}/numpy-wasi-probe
        run: bash experiments/numpy-wasi/probe.sh

      - name: Run diagnostic NumPy builtin registration probe
        env:
          PROBE_DIR: ${{ runner.temp }}/numpy-wasi-probe
        run: |
          if [[ -f "${PROBE_DIR}/numpy-import-probe.wasm" ]]; then
            go run ./cmd/validate-numpy-link-probe \
              -wasm "${PROBE_DIR}/numpy-import-probe.wasm" \
              -output "${PROBE_DIR}/registration-report.json"
          fi

      - name: Print diagnostic result
        if: always()
        env:
          PROBE_DIR: ${{ runner.temp }}/numpy-wasi-probe
        run: |
          if [[ -f "${PROBE_DIR}/report.json" ]]; then
            cat "${PROBE_DIR}/report.json"
          fi
          if [[ -f "${PROBE_DIR}/registration-report.json" ]]; then
            echo '--- builtin registration result ---'
            cat "${PROBE_DIR}/registration-report.json"
          fi
          if [[ -f "${PROBE_DIR}/logs/setup.log" ]]; then
            echo '--- meson setup tail ---'
            tail -n 120 "${PROBE_DIR}/logs/setup.log"
          fi
          if [[ -f "${PROBE_DIR}/logs/compile.log" ]]; then
            echo '--- meson compile tail ---'
            tail -n 120 "${PROBE_DIR}/logs/compile.log"
          fi
          if [[ -f "${PROBE_DIR}/logs/install.log" ]]; then
            echo '--- meson install tail ---'
            tail -n 120 "${PROBE_DIR}/logs/install.log"
          fi
          if [[ -f "${PROBE_DIR}/logs/stage.log" ]]; then
            echo '--- package staging tail ---'
            tail -n 120 "${PROBE_DIR}/logs/stage.log"
          fi
          if [[ -f "${PROBE_DIR}/logs/link.log" ]]; then
            echo '--- monolithic link tail ---'
            tail -n 120 "${PROBE_DIR}/logs/link.log"
          fi
          if [[ -f "${PROBE_DIR}/logs/pack.log" ]]; then
            echo '--- wasi-vfs pack tail ---'
            tail -n 120 "${PROBE_DIR}/logs/pack.log"
          fi

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: numpy-wasi-probe-${{ github.sha }}
          path: |
            ${{ runner.temp }}/numpy-wasi-probe/report.json
            ${{ runner.temp }}/numpy-wasi-probe/registration-report.json
            ${{ runner.temp }}/numpy-wasi-probe/numpy-core-link-probe.wasm
            ${{ runner.temp }}/numpy-wasi-probe/numpy-import-probe.wasm
            ${{ runner.temp }}/numpy-wasi-probe/numpy-package-manifest.json
            ${{ runner.temp }}/numpy-wasi-probe/wasi-cross.ini
            ${{ runner.temp }}/numpy-wasi-probe/logs/
            ${{ runner.temp }}/numpy-wasi-probe/static-extension-manifests/
          if-no-files-found: error
          retention-days: 7
